<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        AI Prompt Battle 2026
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(
                    circle at top,
                    #172554,
                    #020617 60%
                );
            color: white;
            font-family: Arial, sans-serif;
        }


        .battle-container {
            width: 92%;
            max-width: 1100px;
            margin: 40px auto;
        }


        .battle-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }


        .battle-header h1 {
            margin: 0;
            color: #22d3ee;
        }


        .participant-info {
            color: #94a3b8;
            margin-top: 8px;
        }


        .timer-box {
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid #22d3ee;
            background: rgba(
                15,
                23,
                42,
                0.8
            );
            text-align: center;
        }


        .timer-label {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 5px;
        }


        #timer {
            font-size: 32px;
            font-weight: bold;
            color: #22d3ee;
        }


        .timer-warning {
            color: #facc15 !important;
        }


        .timer-danger {
            color: #ef4444 !important;
            animation: timerPulse 1s infinite;
        }


        @keyframes timerPulse {

            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                opacity: 1;
            }

        }


        .question-card {
            padding: 30px;
            border-radius: 18px;
            background: rgba(
                15,
                23,
                42,
                0.9
            );
            border: 1px solid
                rgba(
                    34,
                    211,
                    238,
                    0.25
                );
            box-shadow:
                0 0 30px
                rgba(
                    34,
                    211,
                    238,
                    0.08
                );
        }


        .round-info {
            color: #22d3ee;
            font-weight: bold;
            margin-bottom: 10px;
        }


        #challengeTitle {
            font-size: 32px;
            margin: 10px 0;
        }


        #challengeDescription {
            color: #cbd5e1;
            line-height: 1.7;
            margin-bottom: 25px;
        }


        textarea {
            width: 100%;
            min-height: 180px;
            box-sizing: border-box;
            resize: vertical;
            padding: 18px;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #020617;
            color: white;
            font-size: 16px;
            outline: none;
        }


        textarea:focus {
            border-color: #22d3ee;
            box-shadow:
                0 0 15px
                rgba(
                    34,
                    211,
                    238,
                    0.15
                );
        }


        .button-row {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }


        button {
            padding: 14px 22px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.2s;
        }


        button:hover {
            transform: translateY(-2px);
        }


        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }


        #generateBtn {
            background: #a855f7;
            color: white;
        }


        #submitBtn {
            background: #22d3ee;
            color: #020617;
        }


        .upload-box {
            margin-top: 25px;
            padding: 20px;
            border: 1px dashed #475569;
            border-radius: 12px;
        }


        .upload-box input {
            margin-top: 12px;
        }


        #imagePreview {
            display: none;
            width: 100%;
            max-width: 600px;
            margin-top: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
        }


        #status {
            margin-top: 20px;
            color: #22d3ee;
            min-height: 24px;
        }


        .challenge-progress {
            color: #64748b;
            font-size: 14px;
            margin-top: 10px;
        }

    </style>

</head>


<body>


<div class="battle-container">


    <!-- =========================================
         HEADER
         ========================================= -->

    <div class="battle-header">

        <div>

            <h1>
                AI PROMPT BATTLE 2026
            </h1>

            <div
                class="participant-info"
                id="participantName"
            >
                Participant
            </div>

        </div>


        <div class="timer-box">

            <div class="timer-label">
                TIME REMAINING
            </div>

            <div id="timer">
                20:00
            </div>

        </div>

    </div>


    <!-- =========================================
         QUESTION CARD
         ========================================= -->

    <div class="question-card">


        <div
            class="round-info"
            id="roundInfo"
        >
            Round 1
        </div>


        <h2 id="challengeTitle">
            Loading challenge...
        </h2>


        <p id="challengeDescription">
            Please wait while your assigned challenge loads.
        </p>


        <div
            class="challenge-progress"
            id="challengeProgress"
        >
            Question
        </div>


        <!-- =====================================
             PROMPT
             ===================================== -->

        <h3>
            Create Your AI Prompt
        </h3>


        <textarea
            id="promptInput"
            placeholder="Write your best AI prompt here..."
        ></textarea>


        <!-- =====================================
             IMAGE UPLOAD
             ===================================== -->

        <div class="upload-box">

            <h3>
                Upload Your AI Design
            </h3>

            <p>
                Generate your image using Canva AI
                or another AI image generator,
                then upload the final image here.
            </p>


            <input
                type="file"
                id="imageInput"
                accept="image/*"
            >


            <img
                id="imagePreview"
                alt="Design preview"
            >

        </div>


        <!-- =====================================
             BUTTONS
             ===================================== -->

        <div class="button-row">

            <button
                id="generateBtn"
                type="button"
            >
                Generate with Canva AI
            </button>


            <button
                id="submitBtn"
                type="button"
            >
                Submit Challenge
            </button>

        </div>


        <div id="status"></div>


    </div>

</div>


<script type="module">


/*
=====================================================
FIREBASE
=====================================================
*/

import {
    db
} from "./firebase.js";


import {
    collection,
    addDoc,
    Timestamp,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/*
=====================================================
LOCAL SESSION
=====================================================
*/

const currentUser =
    localStorage.getItem(
        "currentUser"
    );


const currentEmail =
    localStorage.getItem(
        "currentEmail"
    );


/*
=====================================================
LOGIN CHECK
=====================================================
*/

if (
    !currentUser ||
    !currentEmail
) {

    alert(
        "Please login before entering the battle."
    );

    window.location.href =
        "login.html";
}


/*
=====================================================
ELEMENTS
=====================================================
*/

const participantName =
    document.getElementById(
        "participantName"
    );


const roundInfo =
    document.getElementById(
        "roundInfo"
    );


const challengeTitle =
    document.getElementById(
        "challengeTitle"
    );


const challengeDescription =
    document.getElementById(
        "challengeDescription"
    );


const challengeProgress =
    document.getElementById(
        "challengeProgress"
    );


const promptInput =
    document.getElementById(
        "promptInput"
    );


const imageInput =
    document.getElementById(
        "imageInput"
    );


const imagePreview =
    document.getElementById(
        "imagePreview"
    );


const generateBtn =
    document.getElementById(
        "generateBtn"
    );


const submitBtn =
    document.getElementById(
        "submitBtn"
    );


const timerElement =
    document.getElementById(
        "timer"
    );


const statusElement =
    document.getElementById(
        "status"
    );


/*
=====================================================
PARTICIPANT
=====================================================
*/

participantName.innerText =
    currentUser;


/*
=====================================================
15 CHALLENGES
=====================================================
*/

const challenges = [

    {
        id: 1,
        title: "Future City",
        description:
            "Create a futuristic Indian city in 2050 featuring smart transportation, green buildings, renewable energy and advanced technology."
    },

    {
        id: 2,
        title: "AI in Education",
        description:
            "Create a visual showing how AI is transforming education with students, teachers, AI tools and a modern classroom."
    },

    {
        id: 3,
        title: "Eco-Friendly Product",
        description:
            "Create a realistic advertisement for a new eco-friendly reusable water bottle."
    },

    {
        id: 4,
        title: "Cybersecurity Awareness",
        description:
            "Create a college cybersecurity awareness campaign showing data protection, hackers, phishing and unsafe links."
    },

    {
        id: 5,
        title: "Festival Fusion",
        description:
            "Combine an Indian cultural festival with futuristic technology including holograms, drones and smart devices while respecting Indian culture."
    },

    {
        id: 6,
        title: "Space Exploration",
        description:
            "Create a scene of an Indian astronaut landing on Mars in 2045 with a Mars base, rover, Indian flag and Earth visible in the distance."
    },

    {
        id: 7,
        title: "Smart Campus",
        description:
            "Create a futuristic college campus with AI assistants, smart classrooms, digital boards, renewable energy and autonomous transportation."
    },

    {
        id: 8,
        title: "Save the Planet",
        description:
            "Create an emotional environmental campaign showing a polluted Earth transforming into a restored green planet."
    },

    {
        id: 9,
        title: "Tech Startup Logo",
        description:
            "Design a modern logo for a fictional AI startup called NovaMind."
    },

    {
        id: 10,
        title: "Historical Reimagining",
        description:
            "Create an ancient Indian marketplace enhanced with sustainable modern technology such as solar lighting, digital payments and electric transportation."
    },

    {
        id: 11,
        title: "Robot Assistant",
        description:
            "Create a friendly household robot helping an elderly person in a warm and positive environment."
    },

    {
        id: 12,
        title: "Underwater City",
        description:
            "Create an underwater city in 2100 with transparent buildings, marine life, transportation, researchers and sustainable technology."
    },

    {
        id: 13,
        title: "Career of the Future",
        description:
            "Create a futuristic scene showing students preparing for careers in AI, robotics, cybersecurity, data science and space exploration."
    },

    {
        id: 14,
        title: "Mystery Scene",
        description:
            "Create a cinematic mystery scene inside an abandoned futuristic laboratory at night."
    },

    {
        id: 15,
        title: "One Prompt Challenge",
        description:
            "Interpret the idea 'Technology should make humans more human' creatively. No long text."
    }

];


/*
=====================================================
ASSIGNED QUESTION
=====================================================
*/

let currentQuestion =
    Number(
        localStorage.getItem(
            "assignedQuestion"
        )
    );


let currentRound =
    Number(
        localStorage.getItem(
            "assignedRound"
        )
    );


let currentChallenge =
    null;


/*
=====================================================
VALIDATE QUESTION
=====================================================
*/

if (
    !currentQuestion ||
    currentQuestion < 1 ||
    currentQuestion > 15
) {

    alert(
        "No valid challenge has been assigned."
    );

    window.location.href =
        "login.html";
}


/*
=====================================================
LOAD ASSIGNED QUESTION
=====================================================
*/

async function loadAssignedQuestion() {

    /*
    -----------------------------------------
    FIND CHALLENGE
    -----------------------------------------
    */

    currentChallenge =
        challenges.find(
            challenge =>
                challenge.id ===
                currentQuestion
        );


    if (
        !currentChallenge
    ) {

        alert(
            "Challenge not found."
        );

        window.location.href =
            "login.html";

        return;
    }


    /*
    -----------------------------------------
    DISPLAY
    -----------------------------------------
    */

    roundInfo.innerText =
        "Round " +
        currentRound;


    challengeTitle.innerText =
        currentChallenge.title;


    challengeDescription.innerText =
        currentChallenge.description;


    challengeProgress.innerText =
        "Question " +
        currentQuestion +
        " of 15";


    /*
    -----------------------------------------
    SAVE GLOBAL VALUES
    -----------------------------------------
    */

    window.currentChallenge =
        currentChallenge;


    window.currentQuestion =
        currentQuestion;


    window.currentRound =
        currentRound;

}


/*
=====================================================
20 MINUTE TIMER
=====================================================
*/

const TIMER_DURATION =
    20 * 60 * 1000;


let timerInterval = null;


/*
=====================================================
UPDATE TIMER
=====================================================

IMPORTANT:

This function ONLY READS timerStart.

It DOES NOT create timerStart.

timerStart is created in login.html
after successful login.
=====================================================
*/

function updateTimer() {


    /*
    -----------------------------------------
    GET LOGIN TIMER
    -----------------------------------------
    */

    const start =
        Number(
            localStorage.getItem(
                "timerStart"
            )
        );


    /*
    -----------------------------------------
    TIMER NOT STARTED
    -----------------------------------------
    */

    if (
        !start ||
        !Number.isFinite(start)
    ) {

        timerElement.innerText =
            "20:00";


        submitBtn.disabled =
            true;


        generateBtn.disabled =
            true;


        imageInput.disabled =
            true;


        promptInput.disabled =
            true;


        clearInterval(
            timerInterval
        );


        alert(
            "Your competition timer was not started. Please login again."
        );


        window.location.href =
            "login.html";


        return;
    }


    /*
    -----------------------------------------
    CALCULATE ELAPSED
    -----------------------------------------
    */

    const elapsed =
        Date.now() -
        start;


    /*
    -----------------------------------------
    CALCULATE REMAINING
    -----------------------------------------
    */

    const remaining =
        TIMER_DURATION -
        elapsed;


    /*
    -----------------------------------------
    TIME EXPIRED
    -----------------------------------------
    */

    if (
        remaining <= 0
    ) {

        timeExpired();

        return;
    }


    /*
    -----------------------------------------
    MINUTES
    -----------------------------------------
    */

    const minutes =
        Math.floor(
            remaining / 60000
        );


    /*
    -----------------------------------------
    SECONDS
    -----------------------------------------
    */

    const seconds =
        Math.floor(
            (
                remaining %
                60000
            ) / 1000
        );


    /*
    -----------------------------------------
    DISPLAY TIMER
    -----------------------------------------
    */

    timerElement.innerText =
        String(minutes)
            .padStart(2, "0") +
        ":" +
        String(seconds)
            .padStart(2, "0");


    /*
    -----------------------------------------
    5 MINUTE WARNING
    -----------------------------------------
    */

    if (
        remaining <=
        5 * 60 * 1000
    ) {

        timerElement.classList.add(
            "timer-warning"
        );

    }


    /*
    -----------------------------------------
    1 MINUTE DANGER
    -----------------------------------------
    */

    if (
        remaining <=
        60 * 1000
    ) {

        timerElement.classList.remove(
            "timer-warning"
        );


        timerElement.classList.add(
            "timer-danger"
        );

    }

}


/*
=====================================================
TIME EXPIRED
=====================================================
*/

function timeExpired() {

    clearInterval(
        timerInterval
    );


    timerElement.innerText =
        "00:00";


    /*
    -----------------------------------------
    DISABLE CONTROLS
    -----------------------------------------
    */

    submitBtn.disabled =
        true;


    generateBtn.disabled =
        true;


    imageInput.disabled =
        true;


    promptInput.disabled =
        true;


    alert(
        "Time is over! Your competition has ended."
    );


    /*
    -----------------------------------------
    CLEAR ACTIVE SESSION
    -----------------------------------------
    */

    localStorage.removeItem(
        "currentUser"
    );


    localStorage.removeItem(
        "currentEmail"
    );


    localStorage.removeItem(
        "timerStart"
    );


    /*
    IMPORTANT:

    We DO NOT remove:

        assignedQuestion
        assignedRound

    because Firebase is the source of truth
    for the participant assignment.
    */


    window.location.href =
        "login.html";
}


/*
=====================================================
CANVA AI
=====================================================
*/

generateBtn.addEventListener(
    "click",
    () => {

        /*
        -----------------------------------------
        CHECK TIMER
        -----------------------------------------
        */

        const start =
            Number(
                localStorage.getItem(
                    "timerStart"
                )
            );


        if (
            !start
        ) {

            alert(
                "Please login first."
            );

            window.location.href =
                "login.html";

            return;
        }


        /*
        -----------------------------------------
        GET PROMPT
        -----------------------------------------
        */

        const prompt =
            promptInput.value.trim();


        if (!prompt) {

            alert(
                "Please write your AI prompt first."
            );

            promptInput.focus();

            return;
        }


        /*
        -----------------------------------------
        OPEN CANVA AI
        -----------------------------------------
        */

        const canvaLink =
            "https://www.canva.com/ai-image-generator/?prompt=" +
            encodeURIComponent(
                prompt
            );


        window.open(
            canvaLink,
            "_blank"
        );

    }
);


/*
=====================================================
IMAGE PREVIEW
=====================================================
*/

imageInput.addEventListener(
    "change",
    () => {

        const file =
            imageInput.files[0];


        if (
            !file
        ) {

            imagePreview.style.display =
                "none";

            return;
        }


        /*
        -----------------------------------------
        CHECK IMAGE
        -----------------------------------------
        */

        if (
            !file.type.startsWith(
                "image/"
            )
        ) {

            alert(
                "Please select an image file."
            );

            imageInput.value =
                "";

            return;
        }


        /*
        -----------------------------------------
        PREVIEW
        -----------------------------------------
        */

        const reader =
            new FileReader();


        reader.onload =
            function(event) {

                imagePreview.src =
                    event.target.result;


                imagePreview.style.display =
                    "block";
            };


        reader.readAsDataURL(
            file
        );

    }
);


/*
=====================================================
SUBMIT CHALLENGE
=====================================================
*/

submitBtn.addEventListener(
    "click",
    async () => {

        /*
        -----------------------------------------
        CHECK TIMER
        -----------------------------------------
        */

        const timerStart =
            Number(
                localStorage.getItem(
                    "timerStart"
                )
            );


        if (
            !timerStart ||
            !Number.isFinite(
                timerStart
            )
        ) {

            alert(
                "Your competition timer is not active."
            );

            return;
        }


        /*
        -----------------------------------------
        CHECK TIME
        -----------------------------------------
        */

        const now =
            Date.now();


        const elapsed =
            now -
            timerStart;


        if (
            elapsed >=
            TIMER_DURATION
        ) {

            timeExpired();

            return;
        }


        /*
        -----------------------------------------
        GET PROMPT
        -----------------------------------------
        */

        const prompt =
            promptInput.value.trim();


        if (!prompt) {

            alert(
                "Please enter your prompt."
            );

            promptInput.focus();

            return;
        }


        /*
        -----------------------------------------
        GET IMAGE
        -----------------------------------------
        */

        const file =
            imageInput.files[0];


        if (!file) {

            alert(
                "Please upload your AI-generated image."
            );

            return;
        }


        /*
        -----------------------------------------
        DISABLE SUBMIT
        -----------------------------------------
        */

        submitBtn.disabled =
            true;


        generateBtn.disabled =
            true;


        imageInput.disabled =
            true;


        promptInput.disabled =
            true;


        statusElement.innerText =
            "Uploading your design...";


        try {

            /*
            =========================================
            CLOUDINARY
            =========================================
            */

            const formData =
                new FormData();


            formData.append(
                "file",
                file
            );


            formData.append(
                "upload_preset",
                "ml_default"
            );


            const cloudinaryResponse =
                await fetch(
                    "https://api.cloudinary.com/v1_1/pydcirpp/image/upload",
                    {
                        method: "POST",
                        body: formData
                    }
                );


            if (
                !cloudinaryResponse.ok
            ) {

                throw new Error(
                    "Image upload failed."
                );
            }


            const uploadData =
                await cloudinaryResponse.json();


            /*
            =========================================
            CALCULATE TIME
            =========================================
            */

            const submissionTime =
                Date.now();


            const timeUsedSeconds =
                Math.min(
                    Math.floor(
                        (
                            submissionTime -
                            timerStart
                        ) / 1000
                    ),
                    20 * 60
                );


            const timeRemainingSeconds =
                Math.max(
                    0,
                    (
                        20 * 60
                    ) -
                    timeUsedSeconds
                );


            /*
            =========================================
            FIRESTORE SUBMISSION
            =========================================
            */

            statusElement.innerText =
                "Saving your submission...";


            await addDoc(
                collection(
                    db,
                    "submissions"
                ),
                {

                    participant:
                        currentUser,

                    email:
                        currentEmail,

                    round:
                        currentRound,

                    questionNumber:
                        currentQuestion,

                    challengeId:
                        currentChallenge.id,

                    challengeTitle:
                        currentChallenge.title,

                    challengeDescription:
                        currentChallenge.description,

                    prompt:
                        prompt,

                    image:
                        uploadData.secure_url,

                    timerStart:
                        Timestamp.fromMillis(
                            timerStart
                        ),

                    submittedAt:
                        Timestamp.fromMillis(
                            submissionTime
                        ),

                    timeUsedSeconds:
                        timeUsedSeconds,

                    timeRemainingSeconds:
                        timeRemainingSeconds,

                    status:
                        "Submitted"
                }
            );


            /*
            =========================================
            SUCCESS
            =========================================
            */

            statusElement.innerText =
                "Submission successful!";


            alert(
                "Your challenge has been submitted successfully."
            );


            /*
            -----------------------------------------
            CLEAR ACTIVE SESSION
            -----------------------------------------
            */

            localStorage.removeItem(
                "currentUser"
            );


            localStorage.removeItem(
                "currentEmail"
            );


            localStorage.removeItem(
                "timerStart"
            );


            /*
            IMPORTANT:

            Assignment remains stored:

                assignedQuestion
                assignedRound

            Firebase also retains the assignment.
            */


            window.location.href =
                "login.html";

        }

        catch (error) {

            console.error(
                "Submission error:",
                error
            );


            statusElement.innerText =
                "Submission failed. Please try again.";


            submitBtn.disabled =
                false;


            generateBtn.disabled =
                false;


            imageInput.disabled =
                false;


            promptInput.disabled =
                false;


            alert(
                "There was a problem submitting your design."
            );
        }

    }
);


/*
=====================================================
START BATTLE
=====================================================
*/

async function startBattle() {

    /*
    -----------------------------------------
    LOAD QUESTION
    -----------------------------------------
    */

    await loadAssignedQuestion();


    /*
    -----------------------------------------
    START TIMER DISPLAY
    -----------------------------------------

    IMPORTANT:

    updateTimer does NOT start the timer.

    login.html already started it.
    -----------------------------------------
    */

    updateTimer();


    timerInterval =
        setInterval(
            updateTimer,
            1000
        );

}


/*
=====================================================
START
=====================================================
*/

startBattle();

</script>

</body>
</html>
