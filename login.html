<div class="login-container">

<script type="module">

import { db } from "./firebase.js";

import {
    collection,
    query,
    where,
    getDocs,
    doc,
    runTransaction,
    Timestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const TOTAL_QUESTIONS = 15;

const emailInput =
    document.getElementById("email");

const loginBtn =
    document.getElementById("loginBtn");

const message =
    document.getElementById("message");


async function assignQuestionForParticipant(
    userDocId,
    userData
) {

    const userRef =
        doc(db, "users", userDocId);

    const eventRef =
        doc(db, "eventState", "promptForge");

    return await runTransaction(
        db,
        async (transaction) => {

            const userSnap =
                await transaction.get(userRef);

            const eventSnap =
                await transaction.get(eventRef);

            const currentUserData =
                userSnap.data() || userData;

            if (
                currentUserData.assignedQuestion &&
                currentUserData.assignedRound
            ) {

                return {
                    question:
                        Number(
                            currentUserData.assignedQuestion
                        ),

                    round:
                        Number(
                            currentUserData.assignedRound
                        ),

                    existing: true
                };
            }

            const eventData =
                eventSnap.exists()
                    ? eventSnap.data()
                    : {};

            const nextSlot =
                Number(eventData.nextSlot || 1);

            const question =
                ((nextSlot - 1) %
                    TOTAL_QUESTIONS) + 1;

            const assignedRound =
                Math.floor(
                    (nextSlot - 1) /
                    TOTAL_QUESTIONS
                ) + 1;

            transaction.set(
                eventRef,
                {
                    nextSlot:
                        nextSlot + 1
                },
                {
                    merge: true
                }
            );

            transaction.update(
                userRef,
                {
                    assignedQuestion:
                        question,

                    assignedRound:
                        assignedRound,

                    battleAssignedAt:
                        Timestamp.now()
                }
            );

            return {
                question:
                    question,

                round:
                    assignedRound,

                existing: false
            };
        }
    );
}


async function loginParticipant() {

    const email =
        emailInput.value
            .trim()
            .toLowerCase();

    message.innerText = "";

    if (!email) {

        message.innerText =
            "Please enter your email.";

        return;
    }

    loginBtn.disabled = true;

    loginBtn.innerText =
        "CHECKING...";

    try {

        const usersRef =
            collection(db, "users");

        const userQuery =
            query(
                usersRef,
                where("email", "==", email)
            );

        const snapshot =
            await getDocs(userQuery);

        if (snapshot.empty) {

            message.innerText =
                "Email not registered. Please register first.";

            loginBtn.disabled = false;

            loginBtn.innerText =
                "LOGIN & START BATTLE";

            return;
        }

        const userDoc =
            snapshot.docs[0];

        const userData =
            userDoc.data();

        if (
            userData.emailApproved !== true
        ) {

            message.innerText =
                "Your registration is waiting for admin approval.";

            loginBtn.disabled = false;

            loginBtn.innerText =
                "LOGIN & START BATTLE";

            return;
        }

        const assignment =
            await assignQuestionForParticipant(
                userDoc.id,
                userData
            );

        localStorage.setItem(
            "currentUser",
            userData.fullName ||
            "Participant"
        );

        localStorage.setItem(
            "currentEmail",
            userData.email ||
            email
        );

        localStorage.setItem(
            "assignedQuestion",
            String(
                assignment.question
            )
        );

        localStorage.setItem(
            "assignedRound",
            String(
                assignment.round
            )
        );

        /*
         * TIMER STARTS ONLY AFTER
         * SUCCESSFUL LOGIN.
         */

        localStorage.setItem(
            "timerStart",
            String(Date.now())
        );

        window.location.href =
            "battle.html";

    }
    catch (error) {

        console.error(
            "Login error:",
            error
        );

        message.innerText =
            "Login failed. Please try again.";

        loginBtn.disabled = false;

        loginBtn.innerText =
            "LOGIN & START BATTLE";
    }
}


loginBtn.addEventListener(
    "click",
    loginParticipant
);


emailInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            loginParticipant();
        }

    }
);

</script>

</body>
