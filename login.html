<div class="login-container">

        type="email"

<script type="module">

import { db } from "./firebase.js";

import {
    collection,
    query,
    where,
    getDocs,
    doc,
    runTransaction,
    Timestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/*
=====================================================
ELEMENTS
=====================================================
*/

const emailInput =
    document.getElementById("email");

const loginBtn =
    document.getElementById("loginBtn");

const message =
    document.getElementById("message");


/*
=====================================================
GLOBAL SETTINGS
=====================================================
*/

const TOTAL_QUESTIONS = 15;


/*
=====================================================
ASSIGN QUESTION
=====================================================

Participant order:

1  -> Q1
2  -> Q2
3  -> Q3
...
15 -> Q15
16 -> Round 2 Q1
17 -> Round 2 Q2

Existing participants keep their original question.

Firestore transaction prevents two people from
receiving the same slot at the same time.
=====================================================
*/

async function assignQuestionForParticipant(
    userDocId,
    userData
) {

    const userRef =
        doc(
            db,
            "users",
            userDocId
        );

    const eventRef =
        doc(
            db,
            "eventState",
            "promptForge"
        );


    const result =
        await runTransaction(
            db,
            async (transaction) => {

                /*
                -----------------------------------------
                READ USER
                -----------------------------------------
                */

                const userSnapshot =
                    await transaction.get(
                        userRef
                    );


                const currentUser =
                    userSnapshot.exists()
                        ? userSnapshot.data()
                        : userData;


                /*
                -----------------------------------------
                EXISTING ASSIGNMENT
                -----------------------------------------
                */

                if (
                    currentUser.assignedQuestion &&
                    currentUser.assignedRound
                ) {

                    return {
                        question:
                            Number(
                                currentUser.assignedQuestion
                            ),

                        round:
                            Number(
                                currentUser.assignedRound
                            ),

                        existing: true
                    };
                }


                /*
                -----------------------------------------
                READ EVENT STATE
                -----------------------------------------
                */

                const eventSnapshot =
                    await transaction.get(
                        eventRef
                    );


                let nextSlot = 1;


                if (
                    eventSnapshot.exists()
                ) {

                    const eventData =
                        eventSnapshot.data();


                    nextSlot =
                        Number(
                            eventData.nextSlot || 1
                        );
                }


                /*
                -----------------------------------------
                CALCULATE QUESTION
                -----------------------------------------
                */

                const question =
                    ((nextSlot - 1) %
                        TOTAL_QUESTIONS) + 1;


                const assignedRound =
                    Math.floor(
                        (nextSlot - 1) /
                        TOTAL_QUESTIONS
                    ) + 1;


                /*
                -----------------------------------------
                UPDATE GLOBAL SLOT
                -----------------------------------------
                */

                transaction.set(
                    eventRef,
                    {
                        nextSlot:
                            nextSlot + 1
                    },
                    {
                        merge: true
                    }
                );


                /*
                -----------------------------------------
                UPDATE PARTICIPANT
                -----------------------------------------
                */

                transaction.update(
                    userRef,
                    {
                        assignedQuestion:
                            question,

                        assignedRound:
                            assignedRound,

                        battleAssignedAt:
                            Timestamp.now()
                    }
                );


                return {
                    question:
                        question,

                    round:
                        assignedRound,

                    existing:
                        false
                };

            }
        );


    return result;
}


/*
=====================================================
LOGIN
=====================================================
*/

loginBtn.addEventListener(
    "click",
    async () => {

        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        /*
        -----------------------------------------
        VALIDATION
        -----------------------------------------
        */

        if (!email) {

            message.innerText =
                "Please enter your registered email.";

            return;
        }


        loginBtn.disabled = true;

        loginBtn.innerText =
            "CHECKING...";

        message.innerText = "";


        try {

            /*
            -----------------------------------------
            FIND USER
            -----------------------------------------
            */

            const usersRef =
                collection(
                    db,
                    "users"
                );


            const userQuery =
                query(
                    usersRef,
                    where(
                        "email",
                        "==",
                        email
                    )
                );


            const snapshot =
                await getDocs(
                    userQuery
                );


            /*
            -----------------------------------------
            USER NOT FOUND
            -----------------------------------------
            */

            if (
                snapshot.empty
            ) {

                message.innerText =
                    "Email is not registered.";

                loginBtn.disabled =
                    false;

                loginBtn.innerText =
                    "LOGIN & START BATTLE";

                return;
            }


            /*
            -----------------------------------------
            GET USER
            -----------------------------------------
            */

            const userDoc =
                snapshot.docs[0];


            const userData =
                userDoc.data();


            /*
            -----------------------------------------
            APPROVAL CHECK
            -----------------------------------------
            */

            if (
                userData.emailApproved !== true
            ) {

                message.innerText =
                    "Your registration has not been approved by the admin yet.";

                loginBtn.disabled =
                    false;

                loginBtn.innerText =
                    "LOGIN & START BATTLE";

                return;
            }


            /*
            -----------------------------------------
            ASSIGN QUESTION
            -----------------------------------------
            */

            const assignment =
                await assignQuestionForParticipant(
                    userDoc.id,
                    userData
                );


            /*
            -----------------------------------------
            SAVE SESSION DATA
            -----------------------------------------
            */

            localStorage.setItem(
                "currentUser",
                userData.fullName ||
                "Participant"
            );


            localStorage.setItem(
                "currentEmail",
                userData.email ||
                email
            );


            localStorage.setItem(
                "assignedQuestion",
                String(
                    assignment.question
                )
            );


            localStorage.setItem(
                "assignedRound",
                String(
                    assignment.round
                )
            );


            /*
            =================================================
            START TIMER HERE
            =================================================

            IMPORTANT:

            Timer starts ONLY after successful login.

            battle.html will NEVER create the timer.
            =================================================
            */

            if (
                !localStorage.getItem(
                    "timerStart"
                )
            ) {

                localStorage.setItem(
                    "timerStart",
                    String(
                        Date.now()
                    )
                );
            }


            /*
            -----------------------------------------
            GO TO BATTLE
            -----------------------------------------
            */

            window.location.href =
                "battle.html";

        }

        catch (error) {

            console.error(
                "Login error:",
                error
            );


            message.innerText =
                "Login failed. Please try again.";


            loginBtn.disabled =
                false;


            loginBtn.innerText =
                "LOGIN & START BATTLE";
        }

    }
);


/*
=====================================================
ENTER KEY LOGIN
=====================================================
*/

emailInput.addEventListener(
    "keydown",
    (event) => {

        if (
            event.key === "Enter"
        ) {

            loginBtn.click();

        }

    }
);

</script>

</body>
