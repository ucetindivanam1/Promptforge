
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Participant Login | AI Prompt Battle 2026</title>

    <link rel="stylesheet" href="style.css">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;

            background: radial-gradient(
                circle at top,
                #172554,
                #020617
            );

            color: white;
            font-family: Arial, sans-serif;
        }

        .login-container {
            width: 90%;
            max-width: 430px;
            padding: 40px;

            border-radius: 20px;

            background: rgba(15, 23, 42, 0.9);

            border: 1px solid #22d3ee;

            box-shadow:
                0 0 30px rgba(34, 211, 238, 0.25);

            text-align: center;
        }

        h1 {
            margin-bottom: 10px;

            color: #22d3ee;

            font-size: 32px;
        }

        p {
            color: #94a3b8;
            line-height: 1.6;
        }

        input {
            width: 100%;
            padding: 14px;

            margin-top: 20px;

            box-sizing: border-box;

            border-radius: 10px;

            border: 1px solid #334155;

            background: #020617;

            color: white;

            font-size: 16px;

            outline: none;
        }

        input:focus {
            border-color: #22d3ee;

            box-shadow:
                0 0 10px rgba(34, 211, 238, 0.2);
        }

        button {
            width: 100%;

            margin-top: 20px;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #22d3ee;

            color: #020617;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 0 20px rgba(34, 211, 238, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;

            color: #f87171;

            font-size: 14px;
        }

        /* REGISTER OPTION */

        .register-option {
            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid #1e293b;

            color: #94a3b8;

            font-size: 15px;
        }

        .register-option a {
            color: #22d3ee;

            text-decoration: none;

            font-weight: bold;
        }

        .register-option a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: inline-block;

            margin-top: 20px;

            color: #22d3ee;

            text-decoration: none;

            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="login-container">

    <h1>AI PROMPT BATTLE</h1>

    <p>
        Participant Login<br>
        AI Design Challenge 2026
    </p>

    <input
        type="email"
        id="email"
        placeholder="Enter your registered email"
        autocomplete="email"
    >

    <button id="loginBtn">
        LOGIN & START BATTLE
    </button>

    <div id="message"></div>


    <!-- REGISTER OPTION -->

    <div class="register-option">

        New participant?

        <a href="register.html">
            Register here
        </a>

    </div>


    <a href="index.html" class="back-link">
        ← Back to Home
    </a>

</div>


<script type="module">

import { db } from "./firebase.js";

import {
    collection,
    query,
    where,
    getDocs,
    doc,
    runTransaction,
    Timestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const TOTAL_QUESTIONS = 15;


const emailInput = document.getElementById("email");

const loginBtn = document.getElementById("loginBtn");

const message = document.getElementById("message");


/*
    GLOBAL QUESTION ASSIGNMENT

    Participant 1  → Q1
    Participant 2  → Q2
    ...
    Participant 15 → Q15

    Participant 16 → Round 2 Q1
    Participant 17 → Round 2 Q2

    Re-login does NOT create a new assignment.
*/


async function assignQuestionForParticipant(
    userDocId,
    userData
) {

    const userRef = doc(
        db,
        "users",
        userDocId
    );

    const eventRef = doc(
        db,
        "eventState",
        "promptForge"
    );


    return await runTransaction(
        db,
        async (transaction) => {

            const userSnap =
                await transaction.get(userRef);

            const eventSnap =
                await transaction.get(eventRef);


            const currentUserData =
                userSnap.data() || userData;


            /*
                USER ALREADY HAS ASSIGNMENT

                Do not consume another slot.
            */

            if (
                currentUserData.assignedQuestion &&
                currentUserData.assignedRound
            ) {

                return {

                    question:
                        Number(
                            currentUserData.assignedQuestion
                        ),

                    round:
                        Number(
                            currentUserData.assignedRound
                        ),

                    existing: true

                };

            }


            /*
                GET NEXT GLOBAL SLOT
            */

            const eventData =
                eventSnap.exists()
                    ? eventSnap.data()
                    : {};

            const nextSlot =
                Number(eventData.nextSlot || 1);


            /*
                CALCULATE QUESTION
            */

            const question =
                ((nextSlot - 1) % TOTAL_QUESTIONS) + 1;


            /*
                CALCULATE ROUND
            */

            const assignedRound =
                Math.floor(
                    (nextSlot - 1) /
                    TOTAL_QUESTIONS
                ) + 1;


            /*
                RESERVE NEXT SLOT
            */

            transaction.set(
                eventRef,
                {
                    nextSlot:
                        nextSlot + 1
                },
                {
                    merge: true
                }
            );


            /*
                SAVE ASSIGNMENT TO USER
            */

            transaction.update(
                userRef,
                {

                    assignedQuestion:
                        question,

                    assignedRound:
                        assignedRound,

                    battleAssignedAt:
                        Timestamp.now()

                }
            );


            return {

                question:
                    question,

                round:
                    assignedRound,

                existing:
                    false

            };

        }
    );

}


/*
    LOGIN
*/

async function loginParticipant() {

    const email =
        emailInput.value
            .trim()
            .toLowerCase();


    message.innerText = "";


    if (!email) {

        message.innerText =
            "Please enter your email.";

        return;

    }


    loginBtn.disabled = true;

    loginBtn.innerText =
        "CHECKING...";


    try {

        /*
            FIND REGISTERED USER
        */

        const usersRef =
            collection(
                db,
                "users"
            );


        const userQuery =
            query(
                usersRef,
                where(
                    "email",
                    "==",
                    email
                )
            );


        const snapshot =
            await getDocs(
                userQuery
            );


        if (snapshot.empty) {

            message.innerText =
                "Email not registered. Please register first.";

            loginBtn.disabled = false;

            loginBtn.innerText =
                "LOGIN & START BATTLE";

            return;

        }


        const userDoc =
            snapshot.docs[0];


        const userData =
            userDoc.data();


        /*
            CHECK APPROVAL
        */

        if (
            userData.emailApproved !== true
        ) {

            message.innerText =
                "Your registration is waiting for admin approval.";

            loginBtn.disabled = false;

            loginBtn.innerText =
                "LOGIN & START BATTLE";

            return;

        }


        /*
            ASSIGN GLOBAL QUESTION
        */

        const assignment =
            await assignQuestionForParticipant(
                userDoc.id,
                userData
            );


        /*
            SAVE SESSION DATA

            Firebase remains the source of truth
            for the question assignment.
        */

        localStorage.setItem(
            "currentUser",
            userData.fullName ||
            "Participant"
        );


        localStorage.setItem(
            "currentEmail",
            userData.email ||
            email
        );


        localStorage.setItem(
            "assignedQuestion",
            String(
                assignment.question
            )
        );


        localStorage.setItem(
            "assignedRound",
            String(
                assignment.round
            )
        );


        /*
            IMPORTANT:

            TIMER STARTS ONLY AFTER
            SUCCESSFUL LOGIN.

            It is reset here for the
            new battle session.
        */

        localStorage.setItem(
            "timerStart",
            String(
                Date.now()
            )
        );


        /*
            GO TO BATTLE
        */

        window.location.href =
            "battle.html";

    }

    catch (error) {

        console.error(
            "Login error:",
            error
        );


        message.innerText =
            "Login failed. Please try again.";

        loginBtn.disabled = false;

        loginBtn.innerText =
            "LOGIN & START BATTLE";

    }

}


/*
    LOGIN BUTTON
*/

loginBtn.addEventListener(
    "click",
    loginParticipant
);


/*
    ENTER KEY
*/

emailInput.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            loginParticipant();

        }

    }
);

</script>

</body>
</html>
